<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="white"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:78px;font-weight:800}.t{font-size:27px}.m{font-size:29px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}</style><text x="55" y="105" class="n">11</text><text x="55" y="170" class="t">0≤x&lt;2π에서 두 방정식</text><text x="55" y="218" class="t">cos²x+sinx cosx-(1/2)(sinx-cosx)=1</text><text x="55" y="266" class="t">|cosx-a|+cosx-a=0</text><text x="55" y="314" class="t">공통해가 3개일 때 실수 a의 최솟값은?</text><text x="55" y="1110" class="m">① -√2/2   ② -1/2   ③ 1/2   ④ √2/2   ⑤ √3/2</text></svg>
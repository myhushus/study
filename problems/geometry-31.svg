<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="white"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:72px;font-weight:800}.t{font-size:25px}.m{font-size:27px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.pt{fill:#111}.lab{font-size:24px;font-style:italic}</style><text x="55" y="95" class="n">31</text><text x="55" y="155" class="t">AB=8을 지름으로 하는 원 밖의 점 C에서</text><text x="55" y="197" class="t">AC, BC가 원과 다시 만나는 점을 각각 D,E라 한다.</text><text x="55" y="239" class="t">AC=7, cos A=11/16일 때 DE의 길이는?</text><circle cx="500" cy="720" r="250" class="l"/><line x1="250" y1="720" x2="750" y2="720" class="l"/><polyline points="250,720 530,300 750,720" class="l"/><circle cx="355" cy="563" r="6" class="pt"/><circle cx="665" cy="555" r="6" class="pt"/><line x1="355" y1="563" x2="665" y2="555" class="thin"/><text x="220" y="745" class="lab">A</text><text x="760" y="745" class="lab">B</text><text x="525" y="285" class="lab">C</text><text x="330" y="550" class="lab">D</text><text x="675" y="545" class="lab">E</text><text x="55" y="1120" class="m">① 1     ② 4/3     ③ 5/3     ④ 2     ⑤ 7/3</text></svg>
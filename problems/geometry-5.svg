<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="white"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:78px;font-weight:800}.t{font-size:27px}.m{font-size:29px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}</style><text x="55" y="105" class="n">05</text><text x="55" y="170" class="t">0≤x&lt;2π, f(x)=sin x</text><text x="55" y="218" class="t">f(1+f(x))=1/2</text><text x="55" y="266" class="t">의 모든 근의 합은?</text><text x="55" y="1110" class="m">① π     ② 2π     ③ 3π     ④ 4π     ⑤ 5π</text></svg>
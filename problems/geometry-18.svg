<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="#fff"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:76px;font-weight:800}.t{font-size:26px}.m{font-size:28px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.pt{fill:#111}.lab{font-size:25px;font-style:italic}</style><text x="55" y="100" class="n">18</text><text x="55" y="160" class="t">[0,2]에서 f(x)=sin πx, g(x)=a cos πx (a&gt;0)</text><text x="55" y="203" class="t">f와 g의 두 교점을 이은 선분의 중점 M₁,</text><text x="55" y="246" class="t">f와 -g의 두 교점을 이은 선분의 중점 M₂</text><text x="55" y="289" class="t">OM₂=2OM₁일 때 a의 값은?</text><line x1="560" y1="510" x2="930" y2="510" class="thin"/><line x1="590" y1="400" x2="590" y2="720" class="thin"/><path d="M590 510 C650 390 710 390 770 510 S890 630 930 510" class="l"/><path d="M590 430 C650 520 710 620 770 510 S890 400 930 430" class="thin"/><text x="55" y="1125" class="m">① √3/3   ② √2/2   ③ 1   ④ √2   ⑤ √3</text></svg>
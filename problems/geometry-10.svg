<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="white"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:78px;font-weight:800}.t{font-size:27px}.m{font-size:29px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}</style><text x="55" y="105" class="n">10</text><text x="55" y="170" class="t">자연수 n에 대하여 f(x)=sin(nπx)</text><text x="55" y="218" class="t">그래프와 직선 y=x가 만나는 서로 다른 점이 23개가 되도록 하는</text><text x="55" y="266" class="t">모든 자연수 n의 값의 합을 구하시오.</text><line x1="120" y1="760" x2="520" y2="760" class="thin"/><line x1="300" y1="620" x2="300" y2="900" class="thin"/><path d="M110 760 C160 650 210 650 260 760 S360 870 410 760 S500 650 550 760" class="l"/><line x1="120" y1="860" x2="500" y2="650" class="thin"/></svg>
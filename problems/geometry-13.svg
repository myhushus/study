<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="#fff"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:76px;font-weight:800}.t{font-size:26px}.m{font-size:28px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.pt{fill:#111}.lab{font-size:25px;font-style:italic}</style><text x="55" y="100" class="n">13</text><text x="55" y="160" class="t">두 실수 a,b (0&lt;a&lt;1)에 대하여 |sin πx+a|=b</text><text x="55" y="203" class="t">양의 실근을 작은 것부터 나열한 수열 {xₙ}이</text><text x="55" y="246" class="t">공차가 1보다 작은 등차수열일 때</text><text x="55" y="289" class="t">(a+b) × Σ₁¹² xₖ 의 값을 구하시오.</text><line x1="430" y1="660" x2="930" y2="660" class="thin"/><line x1="500" y1="540" x2="500" y2="800" class="thin"/><path d="M430 700 C470 590 520 590 560 700 S650 810 700 700 S790 590 840 700 S900 805 940 700" class="l"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="white"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:78px;font-weight:800}.t{font-size:27px}.m{font-size:29px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}</style><text x="55" y="105" class="n">08</text><text x="55" y="170" class="t">f(x)=log₁/₂{(3/4)(x-5)}, g(x)=tan(aπx), a&gt;0</text><text x="55" y="218" class="t">(가) f의 점근선은 g의 점근선 중 하나이다.</text><text x="55" y="266" class="t">(나) 두 곡선의 모든 교점의 y좌표는 0 이하이다.</text><text x="55" y="314" class="t">a의 최댓값=q/p일 때 p+q를 구하시오.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="white"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:72px;font-weight:800}.t{font-size:25px}.m{font-size:27px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.pt{fill:#111}.lab{font-size:24px;font-style:italic}</style><text x="55" y="95" class="n">35</text><text x="55" y="155" class="t">두 원 C₁,C₂가 A,B에서 만난다.</text><text x="55" y="197" class="t">AC=3, BD=5, AD=BC</text><text x="55" y="239" class="t">cos∠ACB=2/3, cos∠ADB=4/5</text><text x="55" y="281" class="t">r₁²+r₂²=q/p일 때 p+q는?</text><circle cx="390" cy="700" r="230" class="l"/><circle cx="650" cy="700" r="270" class="l"/><circle cx="520" cy="520" r="6" class="pt"/><circle cx="520" cy="860" r="6" class="pt"/><polyline points="300,610 520,520 780,610 520,860 300,610" class="thin"/><text x="520" y="495" class="lab">A</text><text x="520" y="895" class="lab">B</text><text x="270" y="610" class="lab">C</text><text x="790" y="610" class="lab">D</text><text x="250" y="900" class="lab">C₁</text><text x="815" y="900" class="lab">C₂</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="white"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:78px;font-weight:800}.t{font-size:27px}.m{font-size:29px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}</style><text x="55" y="105" class="n">07</text><text x="55" y="170" class="t">0&lt;x&lt;2 또는 2&lt;x&lt;6에서</text><text x="55" y="218" class="t">f(x)=tan(πx/4) (0&lt;x&lt;2)</text><text x="55" y="266" class="t">f(x)=tan(πx/4)+3 (2&lt;x&lt;6)</text><text x="55" y="314" class="t">y=f(x)와 y=(3/4)x+k의 교점 x₁&lt;x₂, x₂=5x₁</text><text x="55" y="362" class="t">k의 값은?</text><text x="55" y="1110" class="m">① 1/4   ② 1/3   ③ 1/2   ④ 1   ⑤ 3/2</text></svg>
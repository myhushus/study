<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="white"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:72px;font-weight:800}.t{font-size:25px}.m{font-size:27px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.pt{fill:#111}.lab{font-size:24px;font-style:italic}</style><text x="55" y="95" class="n">36</text><text x="55" y="155" class="t">원 C₁은 A,B,C를 지나고 중심 O₁, 반지름 5이다.</text><text x="55" y="197" class="t">원 C₂는 A,B,D를 지나고 중심 O₂이며 O₂는 C₁ 위에 있다.</text><text x="55" y="239" class="t">AB=8, △BCD의 넓이=24, A,C,D가 일직선일 때 BD²은?</text><circle cx="500" cy="745" r="185" class="l"/><circle cx="500" cy="560" r="330" class="l"/><line x1="350" y1="875" x2="650" y2="875" class="l"/><line x1="350" y1="875" x2="405" y2="630" class="l"/><line x1="405" y1="630" x2="455" y2="320" class="l"/><line x1="455" y1="320" x2="650" y2="875" class="l"/><text x="325" y="905" class="lab">A</text><text x="660" y="905" class="lab">B</text><text x="375" y="625" class="lab">C</text><text x="440" y="305" class="lab">D</text><text x="485" y="765" class="lab">O₁</text><text x="485" y="590" class="lab">O₂</text></svg>
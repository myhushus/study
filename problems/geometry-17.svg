<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="#fff"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:76px;font-weight:800}.t{font-size:26px}.m{font-size:28px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.pt{fill:#111}.lab{font-size:25px;font-style:italic}</style><text x="55" y="100" class="n">17</text><text x="55" y="160" class="t">0≤x≤3/a에서 f(x)=b sin(aπx), g(x)=b cos(aπx)</text><text x="55" y="203" class="t">두 그래프의 교점을 P,Q,R라 한다.</text><text x="55" y="246" class="t">PQ,QR의 기울기 곱=-3, △PQR의 넓이=√3</text><text x="55" y="289" class="t">a²+b²의 값은?</text><text x="55" y="1125" class="m">① 2   ② 5/2   ③ 3   ④ 7/2   ⑤ 4</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="#fff"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:76px;font-weight:800}.t{font-size:26px}.m{font-size:28px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.pt{fill:#111}.lab{font-size:25px;font-style:italic}</style><text x="55" y="100" class="n">27</text><text x="55" y="160" class="t">사각형 ABCD가 원 C에 내접한다.</text><text x="55" y="203" class="t">AB=1, BC=√2, CD=√3</text><text x="55" y="246" class="t">대각선 BD가 사각형의 넓이를 이등분할 때</text><text x="55" y="289" class="t">원 C의 넓이는 (q/p)π이다. p+q를 구하시오.</text><circle cx="530" cy="690" r="285" class="l"/><polyline points="390,430 270,650 350,900 760,860 390,430" class="l"/><line x1="270" y1="650" x2="760" y2="860" class="l"/><text x="380" y="415" class="lab">A</text><text x="240" y="650" class="lab">B</text><text x="320" y="930" class="lab">C</text><text x="770" y="875" class="lab">D</text><text x="285" y="530" class="t">1</text><text x="240" y="800" class="t">√2</text><text x="525" y="930" class="t">√3</text></svg>
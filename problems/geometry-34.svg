<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="white"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:72px;font-weight:800}.t{font-size:25px}.m{font-size:27px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.pt{fill:#111}.lab{font-size:24px;font-style:italic}</style><text x="55" y="95" class="n">34</text><text x="55" y="155" class="t">AB 위의 점 P가 AP=4, PB=6을 만족한다.</text><text x="55" y="197" class="t">PB를 지름으로 하는 원 C₁ 위의 Q에서 직선 AQ가 원과 다시 만나는 점을 R이라 한다.</text><text x="55" y="239" class="t">A,P,R을 지나는 원 C₂의 반지름이 4일 때 AQ의 길이는? (AQ&lt;AR)</text><line x1="190" y1="810" x2="820" y2="810" class="l"/><circle cx="650" cy="810" r="170" class="l"/><circle cx="400" cy="610" r="260" class="l"/><line x1="190" y1="810" x2="610" y2="570" class="l"/><circle cx="535" cy="615" r="6" class="pt"/><circle cx="610" cy="570" r="6" class="pt"/><text x="165" y="840" class="lab">A</text><text x="455" y="840" class="lab">P</text><text x="825" y="840" class="lab">B</text><text x="510" y="610" class="lab">Q</text><text x="620" y="560" class="lab">R</text><text x="785" y="980" class="lab">C₁</text><text x="225" y="640" class="lab">C₂</text><text x="55" y="1120" class="m">① 6   ② √37   ③ √38   ④ √39   ⑤ 2√10</text></svg>
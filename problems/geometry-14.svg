<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="#fff"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:76px;font-weight:800}.t{font-size:26px}.m{font-size:28px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.pt{fill:#111}.lab{font-size:25px;font-style:italic}</style><text x="55" y="100" class="n">14</text><text x="55" y="160" class="t">f(x)=sin(πx/6), 0&lt;a&lt;3</text><text x="55" y="203" class="t">[a,a+6]에서 최댓값+최솟값=p</text><text x="55" y="246" class="t">[a+2,a+8]에서 최댓값+최솟값=q</text><text x="55" y="289" class="t">|p|=|q|일 때 240{f(4a)}²을 구하시오.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="white"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:78px;font-weight:800}.t{font-size:27px}.m{font-size:29px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}</style><text x="55" y="105" class="n">04</text><text x="55" y="170" class="t">0≤θ&lt;2π에서 x에 대한 방정식</text><text x="55" y="218" class="t">x²+(2cosθ+k)x-sin²θ=0</text><text x="55" y="266" class="t">두 근의 차가 2가 되는 θ는 정확히 2개이고</text><text x="55" y="314" class="t">θ₂=θ₁+π/2일 때 k²을 구하시오.</text></svg>
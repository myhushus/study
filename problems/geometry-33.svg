<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="white"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:72px;font-weight:800}.t{font-size:25px}.m{font-size:27px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.pt{fill:#111}.lab{font-size:24px;font-style:italic}</style><text x="55" y="95" class="n">33</text><text x="55" y="155" class="t">∠B=90°인 직각삼각형 ABC의 내접원이</text><text x="55" y="197" class="t">AB, BC, CA와 만나는 점을 D,E,F라 한다.</text><text x="55" y="239" class="t">AD=6, 삼각형 ABC의 넓이=24, FB²=q/p일 때 p+q는?</text><polyline points="180,850 760,850 760,350 180,850" class="l"/><circle cx="620" cy="710" r="140" class="l"/><text x="150" y="880" class="lab">A</text><text x="765" y="880" class="lab">B</text><text x="770" y="345" class="lab">C</text><text x="600" y="880" class="lab">D</text><text x="775" y="720" class="lab">E</text><text x="490" y="615" class="lab">F</text></svg>
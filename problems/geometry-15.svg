<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="#fff"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:76px;font-weight:800}.t{font-size:26px}.m{font-size:28px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.pt{fill:#111}.lab{font-size:25px;font-style:italic}</style><text x="55" y="100" class="n">15</text><text x="55" y="160" class="t">f(x)=tan(πx/a), 0&lt;x&lt;a/2 또는 3a/2&lt;x≤2a</text><text x="55" y="203" class="t">y=f(x)와 y=2sin(πx/a)의 교점을 A,B,C라 한다.</text><text x="55" y="246" class="t">A,B가 선분 OC를 지름으로 하는 원 위에 있을 때</text><text x="55" y="289" class="t">사각형 AOBC의 넓이는?</text><text x="55" y="1125" class="m">① 14√5/5   ② 16√5/5   ③ 18√5/5   ④ 4√5   ⑤ 22√5/5</text></svg>
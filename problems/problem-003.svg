<style>
  text{fill:#000;font-family:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif}
  .t{font-size:30px}.m{font-size:34px}.s{font-size:27px}.box{fill:none;stroke:#000;stroke-width:2.5}.g{fill:none;stroke:#000;stroke-width:3}.thin{fill:none;stroke:#000;stroke-width:2}
</style>
<text class="m" x="85" y="55" font-weight="700">20.</text>
<text class="t" x="145" y="55">0 ≤ x ≤ 2π 에서 정의된 두 함수</text>
<text class="m" x="205" y="112" font-style="italic">f(x) = sin x,     g(x) = −k cos x   (k &gt; 1)</text>
<text class="t" x="112" y="170">이 있다. 두 곡선 y=f(x)와 y=g(x)가 제1사분면에서 만나는</text>
<text class="t" x="112" y="214">점을 A, 제4사분면에서 만나는 점을 B라 하자.</text>
<text class="t" x="112" y="258">점 A를 지나고 x축에 평행한 직선이 곡선 y=g(x)와 만나는</text>
<text class="t" x="112" y="302">점 중 A가 아닌 점을 C라 하고, 점 B를 지나고 x축에</text>
<text class="t" x="112" y="346">평행한 직선이 곡선 y=g(x)와 만나는 점 중 B가 아닌 점을</text>
<text class="t" x="112" y="390">D라 하자. 다음은</text>
<text class="m" x="175" y="458">(삼각형 CDB의 넓이) : (삼각형 AOD의 넓이) = 14 : 5</text>
<text class="t" x="112" y="520">일 때, 상수 k의 값을 구하는 과정의 일부이다.</text>
<text class="t" x="112" y="562">(단, O는 원점이다.)</text>

<rect class="box" x="95" y="600" width="834" height="720"/>
<text class="t" x="125" y="642">두 곡선 y=f(x)와 y=g(x)는 그림과 같다.</text>

<!-- graph -->
<line class="thin" x1="150" y1="805" x2="875" y2="805"/>
<line class="thin" x1="220" y1="690" x2="220" y2="955"/>
<line class="thin" x1="150" y1="742" x2="875" y2="742"/>
<line class="thin" x1="150" y1="888" x2="875" y2="888"/>
<path class="g" d="M220 805 C290 720 360 720 430 742 C520 770 560 880 660 902 C745 920 810 875 860 805"/>
<path class="g" d="M220 938 C300 920 335 820 430 742 C525 665 630 660 690 742 C760 835 780 885 820 888 C845 890 860 940 875 945"/>
<text class="s" x="184" y="840">O</text><text class="s" x="883" y="820">x</text><text class="s" x="205" y="682">y</text><text class="s" x="820" y="836">2π</text>
<text class="s" x="408" y="730">A</text><text class="s" x="694" y="730">C</text><text class="s" x="802" y="918">B</text><text class="s" x="300" y="916">D</text>
<text class="s" x="286" y="710">y=f(x)</text><text class="s" x="590" y="690">y=g(x)</text>

<text class="t" x="125" y="1002">점 A의 x좌표를 a라 하면</text>
<text class="t" x="125" y="1048">두 점 B, D의 좌표는 다음과 같다.</text>
<text class="m" x="180" y="1102">B(  (가)  , −sin a),     D(  (나)  , −sin a)</text>
<text class="t" x="125" y="1150">삼각형 CDB의 넓이는</text>
<text class="m" x="195" y="1198">1/2 × DB × 2sin a</text>
<text class="t" x="125" y="1245">이고,  (삼각형 AOD의 넓이) = 5/14 × (삼각형 CDB의 넓이)</text>
<text class="t" x="125" y="1293">이므로, a = (다) 이다. 따라서 k = −tan((다)) 이다.</text>

<text class="t" x="92" y="1385">위의 (가), (나)에 알맞은 식을 각각 p(a), q(a)라 하고, (다)에</text>
<text class="t" x="92" y="1432">알맞은 수를 α라 하자. 3 × p(α) / q(α)의 값을 구하시오. [4점]</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="white"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:72px;font-weight:800}.t{font-size:25px}.m{font-size:27px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.pt{fill:#111}.lab{font-size:24px;font-style:italic}</style><text x="55" y="95" class="n">37</text><text x="55" y="155" class="t">AB=3, BC=√7, CA=2인 △ABC의 외접원이 C₁이다.</text><text x="55" y="197" class="t">B,C를 지나는 원 C₂에서 D를 잡고 CD와 C₁의 다른 교점을 E라 한다.</text><text x="55" y="239" class="t">3R₂=√13R₁, CE=1일 때 DE의 길이는?</text><circle cx="360" cy="700" r="230" class="l"/><circle cx="650" cy="700" r="270" class="l"/><circle cx="505" cy="520" r="6" class="pt"/><circle cx="505" cy="875" r="6" class="pt"/><line x1="270" y1="560" x2="505" y2="875" class="l"/><line x1="270" y1="560" x2="505" y2="520" class="l"/><line x1="505" y1="520" x2="810" y2="860" class="l"/><circle cx="610" cy="640" r="6" class="pt"/><text x="240" y="560" class="lab">A</text><text x="490" y="910" class="lab">B</text><text x="495" y="500" class="lab">C</text><text x="815" y="875" class="lab">D</text><text x="620" y="635" class="lab">E</text><text x="55" y="1120" class="m">① 3   ② 17/6   ③ 14/5   ④ 11/4   ⑤ 8/3</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200"><rect width="1000" height="1200" fill="white"/><style>text{fill:#111;font-family:Arial,"Noto Sans KR",sans-serif}.n{font-size:72px;font-weight:800}.t{font-size:25px}.m{font-size:27px;font-weight:600}.l{stroke:#111;stroke-width:3;fill:none}.thin{stroke:#111;stroke-width:2;fill:none}.pt{fill:#111}.lab{font-size:24px;font-style:italic}</style><text x="55" y="95" class="n">38</text><text x="55" y="155" class="t">사각형 ABCD는 원 C₁에 내접하고 P는 원 밖의 점이다.</text><text x="55" y="197" class="t">A는 PD의 중점, B는 PC의 중점, PA:PB:AB=3:3:2</text><text x="55" y="239" class="t">E는 직선 AB 위, △ADE의 외접원이 C₂, 원의 넓이비 C₁:C₂=17:12</text><text x="55" y="281" class="t">AE=3, 사각형 ABCD의 넓이를 S라 할 때 S²은?</text><circle cx="620" cy="620" r="240" class="l"/><circle cx="345" cy="690" r="175" class="l"/><polyline points="470,760 690,760 760,500 420,500 470,760" class="l"/><line x1="470" y1="760" x2="540" y2="1000" class="l"/><line x1="690" y1="760" x2="540" y2="1000" class="l"/><line x1="250" y1="760" x2="470" y2="760" class="l"/><line x1="250" y1="760" x2="420" y2="500" class="l"/><text x="455" y="795" class="lab">A</text><text x="700" y="790" class="lab">B</text><text x="770" y="500" class="lab">C</text><text x="395" y="485" class="lab">D</text><text x="220" y="790" class="lab">E</text><text x="530" y="1040" class="lab">P</text><text x="800" y="450" class="lab">C₁</text><text x="190" y="650" class="lab">C₂</text></svg>
    <img src="problems/problem-001.jpg" alt="수학 문제 14번 원본 사진">
    <h3>문제 원문</h3>
    <div class="text">14. 2 이상의 자연수 n에 대하여

log₂ a + log₂ |2 - 27/n| - 2

의 n제곱근 중 실수인 것의 개수를 f(n)이라 하자. f(2m) ≤ 1을 만족시키는 자연수 m의 개수가 2가 되도록 하는 모든 자연수 a의 값의 합은? [4점]

① 50   ② 54   ③ 58   ④ 62   ⑤ 66</div>

name: Temporary Jeongcheo lesson validation
on:
  push:
    branches: [feature/korean-jeongcheo-20261001]
    paths:
      - 'lessons/jeongcheo.js'
      - 'korean-jeongcheo.html'
      - 'poetry-nav.js'
      - 'service-worker.js'
      - '.qa/jeongcheo.cjs'
      - '.github/workflows/jeongcheo-validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact public repository revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myhushus/study.git
          git fetch --depth=1 origin "$GITHUB_SHA" e6e51b5c53faf5c90a02d6570c6903947caef8b7
          git checkout --detach "$GITHUB_SHA"
      - name: Install pinned isolated browser test dependency
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate content, preservation, grading, storage and responsive layout
        run: |
          node --check lessons/jeongcheo.js
          node --check poetry-nav.js
          node --check service-worker.js
          node --check .qa/jeongcheo.cjs
          node .qa/jeongcheo.cjs
